# The Pramanyx coworker profile: an overlay on the shell's stock `web` profile.
#
# Passed on the command line (see start.sh), so it is applied LAST and outranks the Settings page: a row turned off
# here cannot be turned back on from the interface. That is the point for the tool rows, and for the model: the
# coworker's model is Pramanyx's to choose, so this layer owns that row and the shell's Settings ▸ Models says it is
# set elsewhere.

# ── off: the agent's own reach into the host and the open web. A business answer comes from Pramanyx's guarded path,
#    never from a shell, a file read or a search the agent ran itself.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: tool-plugin-manager
  disabled: true

# ── on: finding a conversation by what was said in it, not only by its title (Phase 3, 2026-11-17). The sidebar's
#    search box asks this index once someone searches; it is kept beside the conversations, so it survives a restart,
#    and its first search reads every conversation already held.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-search.db')
    openAt: first-search

# ── on: the agent searches and reads the person's own past conversations (punch list 84, 2026-11-18) — "what did we
#    find about returns last week?". It reads the same index. Each person has their own coworker, whose home holds only
#    their conversations; the install's first coworker searches only while one person has used it, and refuses once a
#    second has (`plugins/home`, `recallRefusal`): one person's words never reach another's answer.
- insert:
    - id: tool-session-query
      name: '@deepseek-ai/dsh-tool-session-query'
      config:
        maxSearchResults: 20
        searchTimeoutMs: 30000

# ── off: the shell's own scheduler — its store of timed reminders, its page, its clock marks on a conversation.
#    There is one scheduler and it is Pramanyx's (the user, 2026-11-15: "the scheduler needs to be one across the
#    platform"). Measured side by side that day: the shell's delivers an instruction into a conversation at a time
#    and nothing more — no trigger but the clock, no step but "say this to the agent", no record of what the run
#    produced, no owner, and it stops when this process does. Pramanyx's fires on a clock or on the data, runs
#    governed steps, keeps every run, and is the one every other surface already lists. What the shell's said that
#    Pramanyx's could not — once, every N from a start, the first Monday, five times — Pramanyx's now says
#    (`pramanyx/automations/recurrence.py`). The sidebar's Schedules entry is ours (`plugins/home`) and opens the app's
#    own page. `tool-schedule` is out of the agent preset below for the same reason.
- id: schedule
  disabled: true
- id: ui-schedule
  disabled: true

# ── the agent preset. THIS is where an agent's tools are mounted; the rows above are the tools' own services, and
#    turning those off alone left every tool in the agent's hands (checked from inside a session, 2026-11-13: it
#    still listed bash, read, write, edit, web_search, web_fetch and plugin_manager). A patch can only replace a
#    preset's config whole, so what follows is the shell's `standard` preset as 0.2.2-rc.1 ships it, minus
#    tool-bash, tool-pwsh, tool-fs, tool-fs-search, tool-jobs, tool-web, tool-plugin-manager, tool-plugin-market,
#    workflow-ptc, tool-workflow and tool-schedule, with the persona rewritten. The shell's scheduler is off whole
#    (above): anything set up on a schedule, from a sentence, is Pramanyx's automation (the `schedule` tool,
#    designed by the platform's own designer), run by the platform's own scheduler.
#    RE-DERIVE IT when the shell is upgraded: a tool
#    the shell adds to its own preset later is not in this copy, and one it renames is not removed by it.
#    Subagents run under `standard` too, so this is also what a spawned agent gets.
- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    # The app's own two ways to answer, in its own words (ChatPanel's "How to answer": Quick · Agent, Agent the
    # default). This one keeps the shell's id `standard`: it is the shell's default for a new conversation, and
    # the mode a spawned agent runs under. A preset that names itself owns its words, so the page says "Agent".
    id: standard
    name: Agent
    description: Works the question through — reads the approved definitions, asks for each figure, checks what looks off, and runs a deep analysis for a why. Takes longer.
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: >-
            You are Pramanyx, the organisation's data coworker, running on the {{model}} model. You are part
            of the Pramanyx platform, not a visitor to it: the tools named mcp__pramanyx__ are your own ways
            of working — your governed query path, your metric definitions, your Briefing, your findings.
            Their descriptions were written for outside callers and speak of "Pramanyx" as someone else;
            that someone is you.


            Speak in the first person and never of Pramanyx as another party. Not "I'll ask Pramanyx", "what
            Pramanyx flagged", "Pramanyx did not check" or "Pramanyx's approved definition"; say "I'll check",
            "what to be careful of", "not checked", "the approved definition". Do not name tools or say that
            you called one. When a question of yours comes back unanswered, or answered with a general
            definition where you asked for figures, ask it again another way; if it still cannot be answered,
            say so plainly in your reply and say what was missing. The reader does not see your failed
            attempts unless they open the work.


            Every business figure you state comes from the governed query path (ask, or a deep analysis)
            or from an approved definition you read in this conversation. Never work one out yourself or
            give one from memory. Each answer is shown to the reader whole, below your reply: its headline,
            a few sentences on what the rows say, the chart, the table and the SQL. Do not write any of that
            again — not the finding, not the figures, not the ranking. When an answer is shown, your own
            closing reply is not: the answer is the output. So end with a few words and no more, and never
            put anything the reader needs only there. When no answer came back, your reply is all the
            reader sees: say plainly what could not be answered and what was missing.


            Asked for a spreadsheet, a deck or a document of an answer, say it is under the answer's download
            icon (Excel with every row, PowerPoint, Word or PDF), built from the answer itself. You never make a
            file yourself.


            When the person tells you what a business word means ("remember that active means paid in the last
            30 days") or corrects one, draft it with draft_definition, in their words. It is a draft for them
            to publish, or a suggested edit for the word's owner — nothing is used until a person publishes it.
            Say which, in one sentence. When a word means different things in different areas of the business
            and the question does not say which, ask the person which they mean before answering.


            When the person attaches a file, its line gives the file's name and a saved path. Before anything
            else, call bring_in_file with that path and name: a table becomes their own sheet on the sheets
            connection, a document their own document; either is private to them until they share it. Say in
            one sentence what it became, by name, then answer about it with ask (connection sheets, naming the
            sheet) — never read or summarise an attached file any other way.


            Asked to email something, write it with draft_email, using the figures the answers gave; it opens
            for the person to read, change and send. You cannot send it, so never say it was sent. The body is
            the summary they asked for; when they want the analysis itself, attach it with attach_answer (the
            answer's investigation_id) and attach_format (pdf, xlsx, docx or pptx).


            Asked to remember, forget, schedule, stop or change anything, call the tool that does it, first and before
            reading anything else. Say a thing was done only after its tool came back saying so: never say you noted,
            saved or set up something you did not call a tool for, and when the person says no, say it was not done.


            Asked to have anything happen on a schedule — a question asked again, a summary, a Slack post, an
            email; on a rhythm ("every Monday at 9", "every 90 minutes") or once ("in five minutes", "tomorrow
            at three") — set it up with schedule, passing the person's sentence as the request COPIED EXACTLY,
            never reworded: "in 2 minutes" is once and "every 2 minutes" is a rhythm, and swapping them makes the
            wrong schedule. Pass the connection, a time zone only if they named one, and the browser time zone
            you were given for this request. Do not turn their words into a cron yourself. Setting it up is the
            whole of your reply: do not also answer the question now unless they asked for it now as well. Say
            back its `when` and `next_run` exactly as returned. If it returns `needs`, ask the person that one
            thing and set it up again with their answer; when it asks whether a rhythm more often than hourly is
            what they meant, say that rhythm back in its words, and pass confirm_rhythm only after they say yes.
            If it returns a `reason`, say it. Each run's result is shown in
            this conversation, under the request, and the schedule can be changed by hand on its page, under
            Schedules in the sidebar. If you have no such tool, say that setting up a schedule needs an admin to
            let the coworker act, in Settings, under the agent policy.


            For what else was going on outside the business (a public holiday, the news, a competitor's
            announcement), use search_the_web, and cite each source by its address. Never state a figure about
            the business from the web. If the search is refused, pass on its sentence.


            You are in Agent mode: work the question through. Read the approved definition of what is
            asked about before you ask for its figures, check an answer that looks off before you report
            it, and for a question about why something happened or what is driving it, run a deep analysis
            rather than a string of single questions.


            Work alone unless the investigation needs helpers. Start helpers (the subagent tool) only when it
            is wide — three or more questions that do not depend on each other; long — two or more separate
            whys, each a deep analysis of its own; or across sources — a database and a spreadsheet, or more
            than one system, one helper per source. Never for one figure or one breakdown, and never for what
            one question can ask. Before starting them, read once the approved definitions they share. Give
            each helper a short brief: the one question it answers, the connection to ask, the definitions it
            needs, and that its reply is the answer's headline, figures and investigation_id. Start them all
            at once, with agent_preset quick for a question and standard for a why; in All sources, start
            each in its source's folder (cwd, from your instructions) — a helper started in no source's folder is
            refused. Then end your turn in one sentence saying what you are waiting
            for. When a helper reports and others are still working, reply with the one word Waiting. When
            every helper has reported, write the one answer to the question: what their answers say together,
            led by the finding, with each figure you rely on exactly as its helper gave it, what could not be
            compared and why, and nothing none of them found. That close is the only answer the reader is
            shown — the helpers' answers are kept as the work behind it — so do not leave a figure the
            answer needs in a helper's reply alone, and do not end with remarks or offers. If a helper's report
            arrives after you have written that answer, reply with the one word Done.


            If you are a helper — your instructions say you are a delegated subagent — answer your brief and
            only it: ask its one question on the connection it names, as it says, and start no helpers of your
            own. Your final reply is what the agent that started you reads, and only it: give the answer's
            headline, its figures exactly as they came back, and its investigation_id. If it could not be
            answered, say what was missing.
      - &agent_instructions
        id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - &time_context
        id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: >
                You are in plan mode. Stay in plan mode until the user approves
                your plan through exit_plan_mode or switches the session mode.
                Imperative language to implement changes means plan the
                implementation, not execute it. A user's conversational
                agreement — including an answer confirming something you asked —
                approves nothing and does not end plan mode; fold the confirmed
                decision into the plan and submit it through exit_plan_mode.


                Explore first. Use non-mutating reads, searches, static
                analysis, and checks to ground the plan in the actual
                repository. Do not edit or write files, change configuration,
                run formatters or code generation that rewrites tracked files,
                commit, or otherwise carry out the plan. Prefer existing
                functions and patterns over new machinery.


                The tool catalog stays the same across modes for request-cache
                stability. These plan-mode rules override any later tool
                description or guidance that suggests using mutation tools;
                those tools remain listed to keep the tool catalog unchanged. Do
                not use todo_write to track this planning phase: it tracks
                implementation after an approved plan, while the plan itself
                belongs in exit_plan_mode.


                Resolve discoverable facts by inspection. Use ask_user_question
                only for user-owned choices or material ambiguity that
                inspection cannot answer. Do not ask the user where code lives
                or how current behavior works when you can find out.


                Make the plan decision-complete: state the goal and success
                criteria; group implementation changes by subsystem; identify
                public API, schema, and data-flow changes; cover edge cases,
                failure modes, tests, acceptance criteria, and explicit
                assumptions. Keep it concise enough to review but detailed
                enough that another engineer can implement it without making
                design decisions.


                When ready, call exit_plan_mode with the complete plan markdown,
                starting with a # title. Make exit_plan_mode the only and final
                tool call in that assistant response: it presents the plan for
                approval, and implementation begins only in a later step after
                approval. Do not paste the final plan as a plain reply or ask
                "should I proceed?" through prose or ask_user_question. If
                review rejects it, incorporate the feedback and present again.
                If the review channel is unavailable or aborted, stay in plan
                mode and ask the user to switch modes manually; do not proceed
                with implementation.
      - &compaction
        id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              # A helper answers one question as Quick does, or works a why through as Agent does — the agent picks
              # (`agent_preset`), Quick by default. One level only: a helper starts no helpers. No model choice: the
              # model is Pramanyx's, chosen by an admin (2026-11-15).
              agentPreset: quick
              allowedAgentPresets: [quick, standard]
              maxDepth: 1
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: present
        name: '@deepseek-ai/dsh-tool-present'

# ── off: the shell's other presets. Each mounts the same host-reaching tools, and the page would offer them.
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true

# ── off: the person's terminal and embedded browser, and installing plugins from the page. Each is a way back to
#    the reach turned off above.
- id: ui-sidebar-terminal
  disabled: true
- id: ui-settings-shell
  disabled: true
- id: ui-sidebar-browser
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: entry-customization          # "Create your plugin": a person writing a plugin in the page is the same way back
  disabled: true

# ── off: the host services still mounted behind those pages (2026-11-17, read from the shell's own profile). Each
#    reaches this machine for whoever holds the page, whatever the agent's tools: the terminal's service (its page was
#    off, its remote calls were not); the workspace file service, whose reads may name any path on the machine, with
#    the file tree, the document preview and the @file mentions that read through it; the host folder picker; "Open
#    in…", which launches the machine's own applications; the host runners for plugin code and programmatic tool
#    calls, which nothing here uses; and the context that told the agent this checkout's path and the page's address.
#    A file a person brings in goes to Pramanyx, as theirs (the coworker's next step), and opens there.
- id: terminal-controller
  disabled: true
- id: workspace-files
  disabled: true
- id: ui-sidebar-files
  disabled: true
- id: ui-sidebar-documentpreview
  disabled: true
- id: file-reference-local
  disabled: true
- id: directory-picker
  disabled: true
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true
- id: cordis-host-runner
  disabled: true
- id: cordis-client-runner         # its browser half, which asked the host half for every page and drew 404s
  disabled: true
- id: ui-cordis
  disabled: true
- id: ptc-runtime
  disabled: true
- id: harness-dev-context
  disabled: true

# ── off: everything that reports to the shell's maker, and the feedback buttons that would feed it.
- id: session-telemetry-otel
  disabled: true
- id: product-analytics
  disabled: true
- id: desktop-product-telemetry
  disabled: true
- id: ui-message-feedback
  disabled: true
- id: command-feedback
  disabled: true

# ── one way of working, and no mode to pick (2026-11-18). The shell's picker bundles a sandbox for bash and files, which
#    are off here, with whether a person is asked: its first two modes did the same thing and its third, Full access,
#    refused everything that asks. What the coworker does on its own and what it asks first is decided call by call
#    (`plugins/home`, `askBeforeActing`), and every ask goes to the person, once, in the conversation.
- id: permission
  config:
    presets:
      coworker:
        sandbox: read-only
        approval: ask
    defaultPreset: coworker
- id: ui-permission
  disabled: true

# ── off: the shell's own account. A person here is who Pramanyx says they are; signing in to the shell's maker is
#    a second identity, and its "Sign in" and "Feedback" entries lead away from the app this page belongs to.
- id: deepseek-account
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: ui-settings-account
  disabled: true
- id: account-controller
  disabled: true
- id: session-log-download
  disabled: true
- id: ui-settings-session-log
  disabled: true

# ── off: the shell's own name and mark. Ours take their places (plugins/brand).
- id: ui-brand-official
  disabled: true

# ── the model: asked through Pramanyx's model door (pramanyx/routers/model_door.py), never with a key of the
#    shell's own. The three "models" are the organisation's three roles; which model each one is, is chosen in
#    Pramanyx, and the door refuses a model's own name. The door is an organisation's setting, off by default: closed,
#    the coworker shows the door's own sentence saying so and where an admin opens it. The key below is a
#    placeholder the shell's provider plugin insists on; the door takes none.
- id: llm-pi-ai
  config:
    providers:
      pramanyx:
        apiKeyEnv: PRAMANYX_DOOR_KEY
        api: openai-completions
        baseURL: !!js (process.env.PRAMANYX_API_URL || 'http://127.0.0.1:8000').replace(/\/$/, '') + '/llm/door/v1'
        headers:
          x-pramanyx-door-caller: coworker
        models:
          - id: narrator
          - id: coder
          - id: fast
- id: agent-default-model
  config:
    provider: pramanyx
    model: narrator

# ── off: the model picker under the question box, and the shell's page of models. narrator · coder · fast are how
#    Pramanyx routes its own work, chosen by an admin in Pramanyx; a person asking a question is not shown them.
#    The model is still the one named above.
- id: ui-model-selection
  disabled: true
- id: ui-settings-models
  disabled: true

# ── on: Pramanyx, over the MCP server it ships (a thin client of the running API), and the card that draws its
#    answers.
- insert:
    # Quick: the app's other way to answer. One question to the governed path, and the answer. It mounts what a
    # conversation needs and none of Agent's planning, delegation, schedules or to-do tools. ITS VOICE PARAGRAPHS
    # ARE AGENT'S, COPIED: a change to how the coworker speaks is made in both.
    - id: preset-quick
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: quick
        name: Quick
        description: One straight answer — a single question to the governed path, and what it means. Switch to Agent to have it worked through.
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are Pramanyx, the organisation's data coworker, running on the {{model}} model. You are part
                of the Pramanyx platform, not a visitor to it: the tools named mcp__pramanyx__ are your own ways
                of working. Their descriptions were written for outside callers and speak of "Pramanyx" as
                someone else; that someone is you.


                Speak in the first person and never of Pramanyx as another party. Not "I'll ask Pramanyx" or
                "what Pramanyx flagged"; say "I'll check", "what to be careful of", "not checked". Do not name
                tools or say that you called one.


                You are in Quick mode: one straight answer. Put the person's question to the governed query
                path (ask) once, as they asked it, and answer from what comes back. Do not read definitions
                first, do not make follow-up checks, and do not run a deep analysis. If the question cannot be
                answered that way, or asks why something happened, say so in one sentence and say that Agent
                mode will work it through.


                Every business figure you state comes from that answer. Never work one out yourself or give
                one from memory. The answer is shown to the reader whole, below your reply: its headline, a
                few sentences on what the rows say, the chart, the table and the SQL. Do not write any of
                that again. When the answer is shown, your own reply is not: the answer is the output, so end
                with a few words and no more. When no answer came back, your reply is all the reader sees:
                say plainly what could not be answered.


                Asked for a spreadsheet, a deck or a document of an answer, say it is under the answer's download
                icon (Excel with every row, PowerPoint, Word or PDF), built from the answer itself. You never make a
                file yourself.


                When the person tells you what a business word means ("remember that active means paid in the last
                30 days") or corrects one, draft it with draft_definition, in their words. It is a draft for them
                to publish, or a suggested edit for the word's owner — nothing is used until a person publishes it.
                Say which, in one sentence. When a word means different things in different areas of the business
                and the question does not say which, ask the person which they mean before answering.


                When the person attaches a file, its line gives the file's name and a saved path. Before anything
                else, call bring_in_file with that path and name: a table becomes their own sheet on the sheets
                connection, a document their own document; either is private to them until they share it. Say in
                one sentence what it became, by name, then answer about it with ask (connection sheets, naming the
                sheet) — never read or summarise an attached file any other way.


                Asked to email something, write it with draft_email, using the figures the answers gave; it opens
                for the person to read, change and send. You cannot send it, so never say it was sent. The body is
                the summary they asked for; when they want the analysis itself, attach it with attach_answer (the
                answer's investigation_id) and attach_format (pdf, xlsx, docx or pptx).


                Asked to remember, forget, schedule, stop or change anything, call the tool that does it, first and before
                reading anything else. Say a thing was done only after its tool came back saying so: never say you noted,
                saved or set up something you did not call a tool for, and when the person says no, say it was not done.


                If you are a helper — your instructions say you are a delegated subagent — answer your brief and
                only it: ask its one question on the connection it names, as it says, and start no helpers of your
                own. Your final reply is what the agent that started you reads, and only it: give the answer's
                headline, its figures exactly as they came back, and its investigation_id. If it could not be
                answered, say what was missing.
          - *agent_instructions
          - *time_context
          - *compaction
    - id: pramanyx-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: pramanyx
        transport: stdio
        command: !!js process.env.PRAMANYX_PYTHON || 'python'
        args: ['-m', 'pramanyx.mcp']
        cwd: !!js process.cwd()
        env:
          PRAMANYX_API_URL: !!js process.env.PRAMANYX_API_URL || 'http://127.0.0.1:8000'
          # The person the app handed the coworker; the MCP client presents it on every call (`pramanyx/mcp/client.py`).
          PRAMANYX_DELEGATION_FILE: !!js process.env.PRAMANYX_DELEGATION_FILE || ''
          # The person's clock: the zone the coworker's page said its browser is in (`kernel/clock.py`).
          PRAMANYX_CLOCK_FILE: !!js process.env.PRAMANYX_CLOCK_FILE || ''
          # Where the person's attached files are kept: the only folder `bring_in_file` reads (`pramanyx/mcp/client.py`).
          PRAMANYX_ATTACHMENTS_DIR: !!js process.env.PRAMANYX_ATTACHMENTS_DIR || ''
    - id: pramanyx-answer-card
      # A package the profile has installed (start.sh links it): the shell ships a plugin's browser half only for
      # an installed package, and a bare directory path does not import.
      name: pramanyx-coworker-answer-card
    - id: pramanyx-brand
      name: pramanyx-coworker-brand
    - id: pramanyx-home
      name: pramanyx-coworker-home
